    // Disappearing an element. if we click an element, the image will disappear

    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.parentNode);
        //e.target.parentNode.remove() // This line of code will remove the item clicked in browser. But a problem, if we click in the bullet point it will delete all elements. Why? because the parent of the bullet point is the <ul> tag. so the entire parent node will disappear including it elements 

        // We can prevent this with some strict check

        if (e.target.tagName === "IMG") {
             e.target.parentNode.remove() // Now this will remove only images. no problem if we click the ul
        }
    })
